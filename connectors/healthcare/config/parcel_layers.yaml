# Parcel layer registry for parcel_acreage_enrich.py
#
# Two section types:
#   statewide  — one URL covers the full state; keyed by 2-letter postal code.
#   county     — routes by 5-digit county FIPS; keyed by state then FIPS.
#
# Required fields per entry:
#   url             FeatureServer layer endpoint (no trailing slash, no /query)
#   area_field      Field name containing the parcel area value
#   area_unit       "sqft" or "acres"
#   parcel_id_field Field name for the parcel identifier
#
# Optional fields per entry:
#   owner_field     Field name for the owner name (omit if not available)
#
# State coverage notes
# --------------------
#   FL  — Florida Statewide Cadastral (DOR, all 67 counties), area field LND_SQFOOT (sq ft)
#   NC  — NC OneMap Statewide Parcels. The /secure/ endpoint returns "Token Required";
#          it needs an NC OneMap credential we do not hold. NC rows currently yield
#          lookup_status=error until a token is configured or a public layer is found.
#   TX  — No *public* statewide layer. The official TxGIO StratMap statewide parcel
#          service (feature.geographic.texas.gov .../stratmap23_land_parcels_48) also
#          returns "Token Required". All 15 county CAD URLs previously listed here were
#          probed on 2026-09-21 and every one failed (DNS failure, 403, 404, or TLS
#          error). They are commented out below rather than deleted — a dead URL costs
#          a full HTTP timeout on every row, whereas an absent county short-circuits
#          to county_not_configured immediately.
#   PA  — No statewide layer. 9 of the 10 county URLs previously listed here failed the
#          same probe. Montgomery (42091) is the one verified working source and is the
#          only live county entry below.
#   SC  — No ArcGIS layer available. Pull county assessor CSVs manually for the first
#          pass; the connector emits state_not_supported for SC rows.
#
# To add a county, all four steps must pass — step 3 is where most candidates die:
#   1. Find its FeatureServer (county CAD/GIS portal, or search arcgis.com).
#   2. Confirm GET <url>?f=json returns a layer (not "Token Required" / 404 / 403).
#   3. Query 5 sample rows and confirm the area field is populated with LOT area.
#      Verified failures: Travis TCAD SDE_TCAD_PARCELS_AREA is 100% NULL; Dallas
#      ParcelsJoin DEEDACRES is 0 and its SQFT is building area, not lot area.
#   4. Do NOT use Shape__Area / SHAPE_Area as area_field. It is in the layer's
#      projection — on a Web Mercator layer the value is not convertible to acres.
#      Use a real recorded-area attribute (LAND_ACRES, LND_SQFOOT, CALC_ACRES).

statewide:
  FL:
    url: "https://services9.arcgis.com/Gh9awoU677aKree0/arcgis/rest/services/Florida_Statewide_Cadastral/FeatureServer/0"
    area_field: LND_SQFOOT
    area_unit: sqft
    parcel_id_field: PARCELNO
    owner_field: OWN_NAME

  NC:
    url: "https://services.nconemap.gov/secure/rest/services/NC1Map_Cadastral/FeatureServer/0"
    area_field: CALC_ACRES
    area_unit: acres
    parcel_id_field: PARNO
    owner_field: OWNER

county:
  TX:
    # No live entries. Every TX county CAD endpoint probed on 2026-09-21 failed.
    # See the commented block at the end of this file for the URLs that were tried.
    {}

  PA:
    # Montgomery — VERIFIED 2026-09-21. LAND_ACRES is populated with real lot
    # acreages (sampled: 0.1837, 0.3610, 0.1703), so it needs no unit conversion.
    "42091":
      url: "https://services1.arcgis.com/kOChldNuKsox8qZD/arcgis/rest/services/Montgomery_County_Parcels/FeatureServer/6"
      area_field: LAND_ACRES
      area_unit: acres
      parcel_id_field: TAXPIN

